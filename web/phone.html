<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Opti-Mole</title>
<link rel="stylesheet" href="phone.css">
</head>
<body>

<!-- the drifting disc-sheen background; purely decorative -->
<div class="bg" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="sheen"></i></div>

<div id="bar">
  <div id="who">&nbsp;</div>
  <div id="clock">--:--</div>
</div>

<div id="stage"></div>

<!-- capture="environment" opens the real camera app. getUserMedia does not work
     over plain http on a phone, and nobody is installing a certificate at a party. -->
<input id="shutter" type="file" accept="image/*" capture="environment" hidden>

<script src="sound.js"></script>
<script src="phone.js"></script>
<script>OptiMoleSound.controls({ music: false });</script>
</body>
</html>
